name: quality-checks

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      extended:
        description: Run browser/E2E checks too
        required: false
        default: true
        type: boolean

# Advisory only. This workflow must never mutate the repository or act as a
# required merge/development gate. Local development remains portable to other
# hosts and source-control environments.
permissions:
  contents: read

jobs:
  backend-advisory:
    name: Backend advisory checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install backend dev dependencies
        run: python -m pip install -e './backend[dev]'
      - name: Ruff
        continue-on-error: true
        run: python -m ruff check backend/src backend/tests tests/scenarios
      - name: Mypy
        continue-on-error: true
        run: python -m mypy backend/src
      - name: Pytest
        continue-on-error: true
        run: python -m pytest backend/tests tests/scenarios/test_phase0_scenario.py

  frontend-advisory:
    name: Frontend advisory checks
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        continue-on-error: true
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        continue-on-error: true
        working-directory: frontend
        run: npm run build

  extended-advisory:
    name: Optional browser/E2E checks
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.extended }}
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: |
          python -m pip install -e './backend[dev]'
          cd frontend
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser component tests
        continue-on-error: true
        working-directory: frontend
        run: npm run test:browser
      - name: Build frontend
        continue-on-error: true
        working-directory: frontend
        run: npm run build
      - name: Start same-origin app
        continue-on-error: true
        run: |
          CODEFIXER_FRONTEND_DIST="$PWD/frontend/dist" python -m uvicorn codefixer.main:app --host 127.0.0.1 --port 9522 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:9522/api/readiness | grep -q '"ready":true' && exit 0
            sleep 1
          done
          exit 1
      - name: E2E and visual checks
        continue-on-error: true
        working-directory: frontend
        run: npm run test:e2e
