name: main-gate

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 18 * * *'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - run: python -m pip install -e './backend[dev]'
      - run: python -m pytest backend/tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck && npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:browser
      - name: Start backend
        run: |
          python -m pip install -e ./backend
          CODEFIXER_FRONTEND_DIST="$PWD/frontend/dist" python -m uvicorn codefixer.main:app --host 127.0.0.1 --port 9522 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:9522/api/health && break || sleep 1; done
      - working-directory: frontend
        run: npm run test:e2e
